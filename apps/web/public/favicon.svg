<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="go-CRM">
  <!--
    The same mark as the sidebar: an accent square with a bold "g". The accent
    tracks the theme, so the tab icon stays legible against a dark tab strip
    instead of glowing at it.
  -->
  <style>
    .plate { fill: #4f46e5; }
    @media (prefers-color-scheme: dark) {
      .plate { fill: #6366f1; }
    }
  </style>
  <rect class="plate" width="64" height="64" rx="14" />
  <text
    x="32"
    y="34"
    fill="#ffffff"
    font-family="ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
    font-size="42"
    font-weight="700"
    text-anchor="middle"
    dominant-baseline="central"
  >g</text>
</svg>
